name: Validate locale resources

on:
  pull_request:
    paths:
      - 'public/locales/**'
      - 'tools/validate-locales.js'
      - '*.html'
      - 'partials/**'
      - 'assets/scripts/**'
      - '.github/workflows/validate-locales.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'public/locales/**'
      - 'tools/validate-locales.js'
      - '*.html'
      - 'partials/**'
      - 'assets/scripts/**'
      - '.github/workflows/validate-locales.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate locale resources and references
        run: node tools/validate-locales.js
